<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who does what in the underwriting flow · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 0.4rem; }
    .sub { font-family: var(--font-sans); font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · EmbeddedLend</p>
    <h1>Who does what in the underwriting flow</h1>
    <p class="sub">Five actors, one journey. The borrower consents, the lender drives the decision, the platform scores and narrates, eKash moves the money, and the regulator watches — with the AI explanation as the critical handoff back to the lender.</p>

    <svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="swim-title swim-desc">
      <title id="swim-title">Who does what in the underwriting flow</title>
      <desc id="swim-desc">Swimlane diagram across five actors. Borrower applies and repays. Lender requests the decision and reviews the AI explanation. EmbeddedLend consents and pulls data, scores, and explains. eKash disburses and records repayment. BNR oversees compliance.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lane dividers -->
      <line x1="40" y1="80" x2="1240" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="180" x2="1240" y2="180" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="280" x2="1240" y2="280" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="380" x2="1240" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="480" x2="1240" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="580" x2="1240" y2="580" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Actor column divider -->
      <line x1="200" y1="80" x2="200" y2="580" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="48" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BORROWER</text>
      <text x="48" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LENDER</text>
      <text x="36" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">EMBEDDEDLEND</text>
      <text x="48" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">EKASH</text>
      <text x="48" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BNR</text>

      <!-- Arrows (drawn before boxes) -->
      <!-- 1 Apply → Request -->
      <line x1="320" y1="164" x2="320" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2 Request → Consent -->
      <line x1="320" y1="264" x2="320" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3 Consent → Score -->
      <line x1="400" y1="340" x2="480" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4 Score → AI -->
      <line x1="640" y1="340" x2="720" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5 AI → Review (critical handoff, coral) -->
      <line x1="800" y1="316" x2="800" y2="264" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 6 Review → Disburse -->
      <path d="M 880,264 V 300 H 900 V 440 H 640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 7 Disburse → Repay (money in, dashed) -->
      <path d="M 640,464 V 500 H 940 V 140 H 880" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 8 Repay → Repayment -->
      <path d="M 800,164 V 200 H 920 V 440 H 960" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 9 Repayment → Score (feeds scores, dashed) -->
      <path d="M 1120,440 V 520 H 450 V 352 H 480" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 10 Compliance → Consent (audit, dashed) -->
      <line x1="340" y1="516" x2="340" y2="364" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="808" y="280" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="291" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">EXPLAINS</text>

      <rect x="948" y="334" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="976" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MONEY IN</text>

      <rect x="748" y="500" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="790" y="511" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FEEDS SCORES</text>

      <rect x="348" y="440" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="366" y="451" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">AUDIT</text>

      <!-- Borrower: Apply -->
      <rect x="240" y="116" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="138" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apply for loan</text>
      <text x="320" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">thin-file MSME</text>

      <!-- Borrower: Repay -->
      <rect x="720" y="116" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="138" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repay</text>
      <text x="800" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mobile money</text>

      <!-- Lender: Request decision -->
      <rect x="240" y="216" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Request decision</text>
      <text x="320" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /v1/decisions</text>

      <!-- Lender: Review + approve -->
      <rect x="720" y="216" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review + approve</text>
      <text x="800" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the AI explains why</text>

      <!-- Core: Consent + pull -->
      <rect x="240" y="316" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="338" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Consent + pull</text>
      <text x="320" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Open Finance · MoMo</text>

      <!-- Core: Score (coral focal) -->
      <rect x="480" y="316" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="560" y="338" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score</text>
      <text x="560" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic</text>

      <!-- Core: AI explanation -->
      <rect x="720" y="316" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="338" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI explanation</text>
      <text x="800" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">narrative · trace</text>

      <!-- eKash: Disburse -->
      <rect x="480" y="416" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="560" y="438" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Disburse</text>
      <text x="560" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RWF20 flat</text>

      <!-- eKash: Repayment event -->
      <rect x="960" y="416" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1040" y="438" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repayment event</text>
      <text x="1040" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">collection</text>

      <!-- BNR: Compliance (security) -->
      <rect x="240" y="516" width="200" height="48" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="340" y="538" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compliance oversight</text>
      <text x="340" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sandbox · audit</text>

      <!-- Legend -->
      <line x1="40" y1="596" x2="1240" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="626" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="634" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <rect x="132" y="626" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="152" y="634" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal outcome</text>

      <line x1="268" y1="632" x2="296" y2="632" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="304" y="634" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Handoff</text>

      <line x1="388" y1="632" x2="416" y2="632" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="424" y="634" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Money / return / audit</text>

      <line x1="596" y1="632" x2="624" y2="632" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="632" y="634" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Critical handoff</text>
    </svg>
  </div>
</body>
</html>
