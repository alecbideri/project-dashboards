    <p class="eyebrow">DP Integration · EmbeddedLend</p>
    <h1>Data integration topology</h1>
    <p class="sub">What plugs in, what plugs out, and over what wire. Consented sources feed the platform; the underwriting core and credit-history store are the two focal surfaces; lenders and SaaS platforms consume; eKash runs layer-wide for money movement.</p>
