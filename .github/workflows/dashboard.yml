name: Deploy dashboards to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate project dashboards
        shell: bash
        run: |
          for dir in */; do
            if [ -d "${dir}docs" ]; then
              node generate-dashboard.js --project "${dir%/}"
            fi
          done

      - name: Generate master overview
        shell: bash
        run: node generate-dashboard.js --master .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print page URL
        run: echo "Dashboard live at ${{ steps.deployment.outputs.page_url }}"
